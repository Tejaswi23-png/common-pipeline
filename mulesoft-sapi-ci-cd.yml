name: Reusable Workflow To Deploy MuleSoft Application

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment whose secrets and variables supply the values (dev by default)
        type: string
        required: false
        default: dev
      java-version:
        type: string
        required: false
        default: '17'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Create Maven settings
        run: |
          cat > "${{ runner.temp }}/settings.xml" <<'EOF'
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>${env.CA_CLIENT_ID}~?~${env.CA_CLIENT_SECRET}</password>
              </server>
            </servers>
            <pluginGroups>
              <pluginGroup>org.mule.tools</pluginGroup>
            </pluginGroups>
            <profiles>
              <profile>
                <id>mule-extra-repos</id>
                <activation>
                  <activeByDefault>true</activeByDefault>
                </activation>
                <repositories>
                  <repository>
                    <id>mule-public</id>
                    <url>https://repository.mulesoft.org/nexus/content/repositories/public</url>
                  </repository>
                  <repository>
                    <id>anypoint-exchange-v3</id>
                    <url>https://maven.anypoint.mulesoft.com/api/v3/maven</url>
                    <layout>default</layout>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>mule-public</id>
                    <url>https://repository.mulesoft.org/nexus/content/repositories/public</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
          </settings>
          EOF

      - name: Build with Maven
        run: >
          mvn --batch-mode clean package
          --settings "${{ runner.temp }}/settings.xml"
          -DskipMunitTests
        env:
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}

      - name: Stamp artifact file name with commit hash
        run: |
          artifactName1=$(ls target/*.jar | head -1)
          commitHash=$(git rev-parse --short "$GITHUB_SHA")
          artifactName2=$(echo "$artifactName1" | sed "s/\.jar$/-$commitHash.jar/")
          mv "$artifactName1" "$artifactName2"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: target/*.jar

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: artifacts

      - name: Create Maven settings
        run: |
          cat > "${{ runner.temp }}/settings.xml" <<'EOF'
          <settings>
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>${env.CA_CLIENT_ID}~?~${env.CA_CLIENT_SECRET}</password>
              </server>
            </servers>
            <pluginGroups>
              <pluginGroup>org.mule.tools</pluginGroup>
            </pluginGroups>
            <profiles>
              <profile>
                <id>mule-extra-repos</id>
                <activation>
                  <activeByDefault>true</activeByDefault>
                </activation>
                <repositories>
                  <repository>
                    <id>mule-public</id>
                    <url>https://repository.mulesoft.org/nexus/content/repositories/public</url>
                  </repository>
                  <repository>
                    <id>anypoint-exchange-v3</id>
                    <url>https://maven.anypoint.mulesoft.com/api/v3/maven</url>
                    <layout>default</layout>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>mule-public</id>
                    <url>https://repository.mulesoft.org/nexus/content/repositories/public</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
          </settings>
          EOF

      - name: Deploy to ${{ inputs.environment }}
        env:
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
        run: |
          artifactName=$(ls *.jar | head -1)
          mvn --batch-mode mule:deploy \
           --settings "${{ runner.temp }}/settings.xml" \
           -Dmule.artifact="$artifactName" \
           -Dbusiness.group.id="${{ vars.BUSINESS_GROUP_ID }}" \
           -Dca.client.id="${{ secrets.CA_CLIENT_ID }}" \
           -Dca.client.secret="${{ secrets.CA_CLIENT_SECRET }}" \
           -Dch.environment="${{ secrets.ANYPOINT_ENVIRONMENT }}" \
           -Dplatform.client.id="${{ secrets.ENV_CLIENT_ID }}" \
           -Dplatform.client.secret="${{ secrets.ENV_CLIENT_SECRET }}" \
           -Dmule.key="${{ secrets.ENCRYPTION_KEY }}" \
           -Denv="${{ secrets.MULE_ENV }}"
