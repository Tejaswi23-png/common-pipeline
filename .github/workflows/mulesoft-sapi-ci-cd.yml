name: Reusable Workflow To Deploy MuleSoft Application
 
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment whose secrets and variables supply the values (dev by default)
        type: string
        required: false
        default: dev
      common-ref:
        description: Branch or tag of common-pipeline to take maven/settings.xml from
        type: string
        required: false
        default: main
      java-version:
        type: string
        required: false
        default: '17'
 
permissions:
  contents: read
 
jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
 
      - name: Checkout common-pipeline (for maven/settings.xml)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/common-pipeline
          ref: ${{ inputs.common-ref }}
          path: common
          token: ${{ secrets.COMMON_REPO_TOKEN || github.token }}
 
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ inputs.java-version }}
          cache: maven
 
      - name: Build and publish to Exchange
        run: >
          mvn --batch-mode clean deploy
          --settings common/maven/settings.xml
          -DskipMunitTests
          -Dbusiness.group.id="${{ vars.BUSINESS_GROUP_ID }}"
        env:
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
 
      - name: Stamp artifact file name with commit hash
        run: |
          artifactName1=$(ls target/*.jar | head -1)
          commitHash=$(git rev-parse --short "$GITHUB_SHA")
          artifactName2=$(echo "$artifactName1" | sed "s/\.jar$/-$commitHash.jar/")
          mv "$artifactName1" "$artifactName2"
 
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: target/*.jar
 
  deploy:
    name: Deploy to ${{ vars.ANYPOINT_ENVIRONMENT  || inputs.environment }}
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
 
      - name: Checkout common-pipeline (for maven/settings.xml)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/common-pipeline
          ref: ${{ inputs.common-ref }}
          path: common
          token: ${{ secrets.COMMON_REPO_TOKEN || github.token }}
 
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ inputs.java-version }}
          cache: maven
 
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: artifacts
 
      - name: Deploy to ${{ vars.ANYPOINT_ENVIRONMENT }}
        env:
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
        run: |
          artifactName=$(ls *.jar | head -1)
          mvn --batch-mode mule:deploy \
           --settings common/maven/settings.xml \
           -Dmule.artifact="$artifactName" \
           -Dbusiness.group.id="${{ secrets.BUSINESS_GROUP_ID }}" \
           -Dca.client.id="${{ secrets.CA_CLIENT_ID }}" \
           -Dca.client.secret="${{ secrets.CA_CLIENT_SECRET }}" \
           -Dch.environment="${{ secrets.ANYPOINT_ENVIRONMENT }}" \
           -Dplatform.client.id="${{ secrets.ENV_CLIENT_ID }}" \
           -Dplatform.client.secret="${{ secrets.ENV_CLIENT_SECRET }}" \
           -Dmule.key="${{ secrets.ENCRYPTION_KEY }}" \
           -Denv="${{ secrets.MULE_ENV }}" \
           -Dapplication.name="${{ secrets.APP_NAME }}"
